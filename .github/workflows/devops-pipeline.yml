name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # This triggers the conveyor belt every time you push code to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Uses a clean virtual Linux machine hosted by GitHub
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Downloads your code onto the virtual machine

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3 # Prepares the latest Docker build tools

    - name: Log in to Docker Hub
      uses: docker/login-action@v3 # Logs into your Docker Hub using the secrets you saved
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5 # Packages your app and uploads it online
      with:
        context: ./backend # Tells Docker to look inside your backend folder
        push: true # Automatically uploads it to Docker Hub
        tags: ${{ secrets.DOCKER_USERNAME }}/student-backend:latest # Names your online package

